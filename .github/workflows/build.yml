name: 'Build dfu-util'

on:
  workflow_dispatch:

  push:
    branches:
      - 'master'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'tests/**'

  pull_request:
    branches:
      - 'master'
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'tests/**'

permissions:
  contents: read

env:
  PROJECT_VERSION: '0.11-arduino6'
  DFU_UTIL_REPO: https://git.code.sf.net/p/dfu-util/dfu-util
  DFU_UTIL_COMMIT: f9a537c93935d9d536b5ea29b54a226160b2b111
  LIBUSB_VERSION: '1.0.30'
  LIBUSB_SHA256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf
  LLVM_MINGW_VERSION: '20261020'
  LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335

jobs:
  build-dfu-util:
    name: 'Build (${{ matrix.os }}_${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-24.04, host: '' }
          - { os: linux,   arch: '386', runner: ubuntu-24.04, host: i686-linux-gnu,      apt: gcc-i686-linux-gnu }
          - { os: linux,   arch: arm,   runner: ubuntu-24.04, host: arm-linux-gnueabihf, apt: gcc-arm-linux-gnueabihf }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04, host: aarch64-linux-gnu,   apt: gcc-aarch64-linux-gnu }
          - { os: darwin,  arch: amd64, runner: macos-latest, host: x86_64-apple-darwin, cflags: '-arch x86_64 -mmacosx-version-min=10.13', macho: x86_64 }
          - { os: darwin,  arch: arm64, runner: macos-latest, host: '',                  cflags: '-arch arm64 -mmacosx-version-min=11.0',   macho: arm64 }
          - { os: windows, arch: '386', runner: ubuntu-24.04, host: i686-w64-mingw32 }
          - { os: windows, arch: amd64, runner: ubuntu-24.04, host: x86_64-w64-mingw32 }
          - { os: windows, arch: arm64, runner: ubuntu-24.04, host: aarch64-w64-mingw32 }

    env:
      HOST: ${{ matrix.host }}
      TARGET: ${{ matrix.os }}_${{ matrix.arch }}
      PREFIX: ${{ github.workspace }}/libusb-install

    defaults:
      run:
        shell: bash

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4

    - name: 'Install deps (Ubuntu)'
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config ${{ matrix.apt }}

    - name: 'Install deps (macOS)'
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool pkg-config

    - name: 'Install llvm-mingw'
      if: matrix.os == 'windows'
      run: |
        NAME="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o "${NAME}.tar.xz" \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${NAME}.tar.xz"
        echo "${LLVM_MINGW_SHA256}  ${NAME}.tar.xz" | sha256sum -c -
        tar xf "${NAME}.tar.xz" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/${NAME}/bin" >> "$GITHUB_PATH"

    - name: 'Set toolchain'
      run: |
        CFLAGS="-O2 ${{ matrix.cflags }}"
        LDFLAGS="${{ matrix.cflags }}"
        EXE=""
        case "${{ matrix.os }}" in
          linux)
            CC="${HOST:+${HOST}-}gcc"
            STRIP="${HOST:+${HOST}-}strip"
            LDFLAGS="${LDFLAGS} -static"
            ;;
          windows)
            CC="${HOST}-clang"
            STRIP="${HOST}-strip"
            LDFLAGS="${LDFLAGS} -static"
            EXE=".exe"
            ;;
          darwin)
            CC="clang"
            STRIP="strip"
            ;;
        esac
        {
          echo "CC=${CC}"
          echo "CFLAGS=${CFLAGS}"
          echo "LDFLAGS=${LDFLAGS}"
          echo "STRIP=${STRIP}"
          echo "EXE=${EXE}"
          echo "NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
        } >> "$GITHUB_ENV"

    - name: 'Fetch sources'
      run: |
        git clone "${DFU_UTIL_REPO}" dfu-util-src
        git -C dfu-util-src checkout "${DFU_UTIL_COMMIT}"
        git -C dfu-util-src apply "${GITHUB_WORKSPACE}"/patches/*.patch
        sed -i.orig "s/\[0\.11-dev\]/[${PROJECT_VERSION}]/" dfu-util-src/configure.ac
        grep -qF "[${PROJECT_VERSION}]" dfu-util-src/configure.ac

        curl -fsSL -o libusb.tar.bz2 \
          "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
        echo "${LIBUSB_SHA256}  libusb.tar.bz2" | shasum -a 256 -c -
        tar xf libusb.tar.bz2

    - name: 'Build libusb'
      run: |
        cd "libusb-${LIBUSB_VERSION}"
        CONFIGURE_ARGS="--prefix=${PREFIX} --with-pic --enable-static --disable-shared"
        if [ "${{ matrix.os }}" = "linux" ]; then
          CONFIGURE_ARGS="${CONFIGURE_ARGS} --disable-udev"
        fi
        ./configure ${HOST:+--host=${HOST}} ${CONFIGURE_ARGS}
        make -j"${NPROC}"
        make install

    - name: 'Build dfu-util'
      env:
        PKG_CONFIG: pkg-config --static
        PKG_CONFIG_LIBDIR: ${{ github.workspace }}/libusb-install/lib/pkgconfig
      run: |
        cd dfu-util-src
        ./autogen.sh
        ./configure ${HOST:+--host=${HOST}}
        make -C src -j"${NPROC}"

        mkdir -p "../${TARGET}"
        for b in dfu-util dfu-suffix dfu-prefix; do
          cp "src/${b}${EXE}" "../${TARGET}/"
          "${STRIP}" "../${TARGET}/${b}${EXE}"
        done

    - name: 'Check binaries'
      run: |
        for f in "${TARGET}"/*; do
          echo "== ${f}"
          case "${{ matrix.os }}" in
            linux)
              file "${f}"
              file "${f}" | grep -Eq 'statically linked|static-pie linked'
              ;;
            windows)
              llvm-objdump -p "${f}" | grep 'DLL Name'
              if llvm-objdump -p "${f}" | grep -iE 'DLL Name: (libusb|libwinpthread|libgcc|libc\+\+|libunwind)'; then
                echo "Error: ${f} depends on a non-system DLL"
                exit 1
              fi
              ;;
            darwin)
              otool -L "${f}"
              if otool -L "${f}" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
                echo "Error: ${f} links a non-system library"
                exit 1
              fi
              vtool -show-build "${f}"
              test "$(lipo -archs "${f}")" = "${{ matrix.macho }}"
              ;;
          esac
        done

    - name: 'Sign binaries (macOS)'
      if: matrix.os == 'darwin'
      run: |
        for f in "${TARGET}"/*; do
          codesign --force --sign - "${f}"
          codesign --verify --strict --verbose "${f}"
        done

    - name: 'Package'
      run: |
        chmod +x "${TARGET}"/*
        tar czf "dfu-util-${PROJECT_VERSION}-${TARGET}.tar.gz" "${TARGET}"

    - name: 'Upload artifact'
      uses: actions/upload-artifact@v4
      with:
        name: dfu-util-${{ env.TARGET }}
        path: dfu-util-${{ env.PROJECT_VERSION }}-${{ env.TARGET }}.tar.gz
        retention-days: 1
        if-no-files-found: error

  test-dfu-util:
    name: 'Test (${{ matrix.target }})'
    needs: [build-dfu-util]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, runner: ubuntu-24.04 }
          - { target: linux_386,   runner: ubuntu-24.04 }
          - { target: linux_arm64, runner: ubuntu-24.04-arm }

    defaults:
      run:
        shell: bash

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4

    - name: 'Download artifact'
      uses: actions/download-artifact@v4
      with:
        name: dfu-util-${{ matrix.target }}

    - name: 'Extract'
      run: tar xzf "dfu-util-${PROJECT_VERSION}-${{ matrix.target }}.tar.gz"

    - name: 'Load vhci-hcd'
      run: |
        if ! sudo modprobe vhci-hcd; then
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vhci-hcd
        fi

    - name: 'Run tests'
      run: sudo python3 -I tests/run.py --dfu-util "${{ matrix.target }}/dfu-util"

  create-release:
    runs-on: ubuntu-24.04
    needs: [build-dfu-util, test-dfu-util]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: 'Check tag'
      run: |
        if [ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]; then
          echo "Error: tag ${GITHUB_REF_NAME} does not match PROJECT_VERSION ${PROJECT_VERSION}"
          exit 1
        fi

    - name: 'Download artifacts'
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        pattern: 'dfu-util-*'
        merge-multiple: true

    - name: 'Create release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        cd artifacts
        sha256sum dfu-util-*.tar.gz > "dfu-util-${PROJECT_VERSION}.sha256"
        cat "dfu-util-${PROJECT_VERSION}.sha256"
        gh release create "${GITHUB_REF_NAME}" \
          --title "dfu-util ${PROJECT_VERSION}" \
          --notes "Built from dfu-util commit ${DFU_UTIL_COMMIT} with libusb ${LIBUSB_VERSION}." \
          ./*
